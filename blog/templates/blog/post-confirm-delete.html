{% extends "base.html" %}

{% block title %}Delete Post{% endblock %}

{% block content %}
<div class="mx-auto" style="max-width: 500px;">
    <h1 class="mb-3">Delete Post</h1>
    <p>Are you sure you want to delete "<strong>{{ post.title }}</strong>"? This action cannot be undone.</p>

    <form method="post">
        {% csrf_token %}
        <div class="d-flex gap-2">
            <button type="submit" class="btn btn-danger">Yes, delete it</button>
            <a href="{% url 'post-detail-page' slug=post.slug %}" class="btn btn-outline-secondary">Cancel</a>
        </div>
    </form>
</div>
{% endblock %}
